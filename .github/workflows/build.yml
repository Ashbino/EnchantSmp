name: Build EnchantSmp

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Find the Gradle project folder
        id: find
        run: |
          BUILD_FILE=$(find . -maxdepth 4 -name build.gradle -not -path './.git/*' | sort | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "No build.gradle found anywhere in the repository!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Found Gradle project in: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build --no-daemon

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: EnchantSmp-jar
          path: ${{ steps.find.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
