
name: Build EnchantSmp

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Find Gradle project and build
        shell: bash
        run: |
          BUILD_FILE="$(find . -name build.gradle -not -path '*/.gradle/*' -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "Could not find build.gradle anywhere in the repository."
            exit 1
          fi

          BUILD_DIR="$(dirname "$BUILD_FILE")"
          echo "Building Gradle project in: $BUILD_DIR"
          cd "$BUILD_DIR"
          gradle build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: EnchantSmp
          path: '**/build/libs/*.jar'
          if-no-files-found: error
