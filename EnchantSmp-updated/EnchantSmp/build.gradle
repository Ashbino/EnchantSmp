plugins {
    id 'java'
}

group = 'com.enchantsmp'
version = '0.1.0'

repositories {
    mavenCentral()
    maven {
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    // Paper 26.2 API. If Paper publishes a different build suffix,
    // update this version to match the server's API version.
    compileOnly 'io.papermc.paper:paper-api:26.2-R0.1-SNAPSHOT'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
